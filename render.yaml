services:
  - type: web
    name: studio-video-final-ultime
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: studio-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: STORAGE_DIR
        value: /app/storage
      - key: ALWAYS_ON_SERVER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TREG_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
